name: Backend Cron

on:
  schedule:
    - cron: "0 18 * * *"
    - cron: "30 15 * * 0"
  workflow_dispatch:

jobs:
  cron:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger backend scheduler endpoint
        run: |
          if [ -n "${{ secrets.BACKEND_CRON_URL }}" ]; then
            curl -fsS "${{ secrets.BACKEND_CRON_URL }}"
          fi

