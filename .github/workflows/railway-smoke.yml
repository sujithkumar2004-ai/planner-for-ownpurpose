name: Production Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Backend health
        run: |
          test -n "${{ secrets.BACKEND_HEALTH_URL }}"
          curl -fsS "${{ secrets.BACKEND_HEALTH_URL }}"
      - name: Frontend load
        run: |
          test -n "${{ secrets.FRONTEND_URL }}"
          curl -fsSI "${{ secrets.FRONTEND_URL }}"

