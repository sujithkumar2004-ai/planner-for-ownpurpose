services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - redis
  celery-worker:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env
    command: celery -A app.tasks worker --loglevel=INFO
    depends_on:
      - redis
  celery-beat:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env
    command: celery -A app.tasks beat --loglevel=INFO
    depends_on:
      - redis
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  redis_data:

