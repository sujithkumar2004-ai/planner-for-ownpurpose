services:
  - type: web
    name: finalplanner-backend
    runtime: docker
    rootDir: backend
    plan: starter
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_TO
        value: skpersonal04@gmail.com
      - key: SENTRY_DSN
        sync: false
  - type: worker
    name: finalplanner-celery-worker
    runtime: docker
    rootDir: backend
    dockerCommand: celery -A app.tasks worker --loglevel=INFO
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
  - type: worker
    name: finalplanner-celery-beat
    runtime: docker
    rootDir: backend
    dockerCommand: celery -A app.tasks beat --loglevel=INFO
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false

