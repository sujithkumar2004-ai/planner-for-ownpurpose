services:
  - type: web
    name: finalplanner-backend
    runtime: docker
    rootDir: backend
    plan: starter
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_TO
        value: skpersonal04@gmail.com
      - key: SENTRY_DSN
        sync: false
      - key: WEB_CONCURRENCY
        value: "2"
      - key: RUN_PRODUCTION_SEED
        value: "false"
      - key: PRODUCTION_SEED_EMAIL
        value: skpersonal04@gmail.com
      - key: PRODUCTION_SEED_PASSWORD
        sync: false
  - type: worker
    name: finalplanner-celery-worker
    runtime: docker
    rootDir: backend
    dockerCommand: celery -A app.tasks worker --loglevel=INFO
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_TO
        value: skpersonal04@gmail.com
      - key: SENTRY_DSN
        sync: false
      - key: TIMEZONE
        value: Asia/Kolkata
  - type: worker
    name: finalplanner-celery-beat
    runtime: docker
    rootDir: backend
    dockerCommand: celery -A app.tasks beat --loglevel=INFO
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_TO
        value: skpersonal04@gmail.com
      - key: SENTRY_DSN
        sync: false
      - key: TIMEZONE
        value: Asia/Kolkata
